<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#ocean)"/>
  
  <!-- Fishing rod -->
  <path d="M12 52 L45 12" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M45 12 L52 8" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Reel -->
  <circle cx="20" cy="44" r="6" fill="#64748b" stroke="#475569" stroke-width="1"/>
  <circle cx="20" cy="44" r="3.5" fill="#94a3b8"/>
  <line x1="20" y1="40.5" x2="20" y2="38" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Fishing line -->
  <path d="M45 12 L48 28 Q49 32 47 34" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="2,2"/>
  
  <!-- Hook -->
  <path d="M47 34 L47 40 Q47 44 43 44 Q40 44 40 41" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Waves -->
  <path d="M4 56 Q8 54 12 56 T20 56 T28 56 T36 56 T44 56 T52 56 T60 56" stroke="#fff" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
