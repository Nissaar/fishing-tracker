# Traefik terminates TLS and reports the original scheme; pass that on rather
# than nginx's own (always http). The API sets its OAuth session cookie with
# the Secure flag only when it knows the visitor is on https, so forwarding
# "http" made every Google sign-in fail its state check.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. add_header in a location block replaces these rather
    # than adding to them, so every location that sets its own headers
    # includes this file again.
    include /etc/nginx/conf.d/security-headers.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current hashed bundles; a cached copy from before a
    # deploy points at files that no longer exist and renders a blank page
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Built assets have a content hash in their name, so they never change
    location /static/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
