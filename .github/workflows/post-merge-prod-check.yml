name: Post-Merge Prod Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install required OS packages for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libnss3 libxss1 libgtk-3-0 libdrm2 libgbm1

      - name: Install deps
        run: |
          npm install playwright@1.42.0 axios

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run checks
        env:
          BASE_URL: https://fishing.nissaar.com
        run: |
          node .github/scripts/prod-check.js

      - name: Upload HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prod-check-report
          path: .github/scripts/prod-check-report.html
