name: E2E Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

# Needed so the run can leave its report as a comment on the pull request
permissions:
  contents: read
  pull-requests: write

env:
  TEST_USER_EMAIL: e2etest@fishingtracker.mu
  TEST_USER_PASSWORD: password
  TEST_ADMIN_EMAIL: admin@fishingtracker.mu
  TEST_ADMIN_PASSWORD: password

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: fishing_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd backend && npm install --legacy-peer-deps
          cd ../frontend && npm install --legacy-peer-deps
          cd ../e2e && npm install

      - name: Install Playwright
        run: cd e2e && npx playwright install chromium --with-deps

      - name: Initialize database
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d fishing_tracker -f init.sql
          PGPASSWORD=testpassword psql -h localhost -U postgres -d fishing_tracker -f e2e/init-test-users.sql

      - name: Start backend
        run: |
          cd backend
          cat > .env << EOF
          NODE_ENV=test
          PORT=5000
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=fishing_tracker
          DB_USER=postgres
          DB_PASSWORD=testpassword
          JWT_SECRET=test-jwt-secret
          JWT_EXPIRE=7d
          SESSION_SECRET=test-session-secret
          CORS_ORIGIN=http://localhost:3000
          EOF
          npm start &
          sleep 10

      - name: Build and serve frontend
        run: |
          cd frontend
          REACT_APP_API_URL=http://localhost:5000/api npm run build
          npx serve -s build -l 3000 &
          sleep 5
        env:
          CI: false

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:5000/health; do sleep 2; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 2; done'

      # The backend applies pending migrations on boot. This endpoint only
      # answers once the events tables exist, so it doubles as the gate that
      # migrations finished before the suite starts.
      - name: Wait for database migrations
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:5000/api/public/events/upcoming >/dev/null; do sleep 2; done'
          echo "Migrations applied - events tables are live"

      - name: Run E2E tests
        id: tests
        continue-on-error: true
        # No --reporter flag: that would override playwright.config.js, whose
        # reporters write the HTML report and test-results/results.json that
        # the steps below depend on
        run: |
          cd e2e
          npx playwright test
        env:
          TEST_BASE_URL: http://localhost:3000
          TEST_API_URL: http://localhost:5000/api
          CI: true

      - name: Build feature report
        id: report
        if: always()
        continue-on-error: true
        run: node .github/scripts/e2e-report.js e2e/test-results/results.json e2e-report.md

      - name: Comment report on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- e2e-feature-report -->';
            const body = marker + '\n' + (fs.existsSync('e2e-report.md')
              ? fs.readFileSync('e2e-report.md', 'utf8')
              : '## 🎣 Fishing Tracker — feature test report\n\n> ❌ The report could not be generated. Check the job log.');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Replace the previous report rather than stacking a new comment
            // on every push to the branch
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: e2e/test-results/
          retention-days: 30

      - name: Upload feature report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-report-${{ github.run_id }}
          path: e2e-report.md
          retention-days: 30

      # The report publishes first, so a failure here still leaves a readable
      # summary on the run and on the PR
      - name: Fail if any feature check failed
        if: always() && (steps.tests.outcome == 'failure' || steps.report.outcome == 'failure')
        run: |
          echo "One or more feature checks failed - see the job summary above."
          exit 1
