name: E2E Tests - Fishing Tracker Pro

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
      - develop

env:
  TEST_USER_EMAIL: e2etest@fishingtracker.mu
  TEST_USER_PASSWORD: password
  TEST_ADMIN_EMAIL: admin@fishingtracker.mu
  TEST_ADMIN_PASSWORD: password
  TEST_BASE_URL: http://localhost:3000
  TEST_API_URL: http://localhost:5000/api

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: fishing_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
        continue-on-error: true

      - name: Install backend dependencies
        run: |
          cd backend
          npm cache clean --force
          npm install --legacy-peer-deps --no-optional --no-fund

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --no-optional --no-fund
        env:
          CI: false

      - name: Install E2E test dependencies
        run: |
          cd e2e
          npm cache clean --force
          npm install --no-optional --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: |
          cd e2e
          npx playwright install --with-deps chromium
        continue-on-error: false

      - name: Initialize database
        run: |
          echo "Waiting for PostgreSQL to be fully ready..."
          sleep 5
          
          # Test connection
          PGPASSWORD=testpassword psql -h localhost -U postgres -d fishing_tracker -c "SELECT 1" || {
            echo "Failed to connect to database"
            exit 1
          }
          
          echo "Running database schema initialization..."
          # Extract only the schema from init.sql (skip CREATE DATABASE line)
          PGPASSWORD=testpassword psql -h localhost -U postgres -d fishing_tracker << 'EOF'
          -- Drop existing tables if they exist (for clean test run)
          DROP TABLE IF EXISTS fishing_logs CASCADE;
          DROP TABLE IF EXISTS custom_submissions CASCADE;
          DROP TABLE IF EXISTS contact_messages CASCADE;
          DROP TABLE IF EXISTS users CASCADE;
          DROP TABLE IF EXISTS fishing_types CASCADE;
          DROP TABLE IF EXISTS fish_species CASCADE;
          DROP TABLE IF EXISTS fishing_methods CASCADE;
          DROP TABLE IF EXISTS bait_types CASCADE;
          DROP TABLE IF EXISTS bait_type_mapping CASCADE;
          DROP TABLE IF EXISTS locations CASCADE;
          DROP TABLE IF EXISTS system_logs CASCADE;
          
          -- Create all tables from init.sql
          CREATE OR REPLACE FUNCTION update_updated_at_column()
          RETURNS TRIGGER AS $$
          BEGIN
              NEW.updated_at = CURRENT_TIMESTAMP;
              RETURN NEW;
          END;
          $$ language 'plpgsql';
          
          CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              username VARCHAR(50) UNIQUE NOT NULL,
              email VARCHAR(100) UNIQUE NOT NULL,
              password_hash VARCHAR(255),
              google_id VARCHAR(255) UNIQUE,
              avatar_url VARCHAR(500),
              is_admin BOOLEAN DEFAULT FALSE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE TRIGGER update_users_updated_at BEFORE UPDATE ON users
              FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
          
          CREATE TABLE IF NOT EXISTS fishing_types (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) UNIQUE NOT NULL,
              description TEXT,
              is_active BOOLEAN DEFAULT TRUE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE TABLE IF NOT EXISTS fish_species (
              id SERIAL PRIMARY KEY,
              local_name VARCHAR(100) NOT NULL,
              english_name VARCHAR(100),
              scientific_name VARCHAR(100) UNIQUE,
              description TEXT,
              is_active BOOLEAN DEFAULT TRUE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE TABLE IF NOT EXISTS bait_types (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) UNIQUE NOT NULL,
              description TEXT,
              is_active BOOLEAN DEFAULT TRUE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE TABLE IF NOT EXISTS bait_type_mapping (
              id SERIAL PRIMARY KEY,
              fishing_type_id INTEGER REFERENCES fishing_types(id) ON DELETE CASCADE,
              bait_type_id INTEGER REFERENCES bait_types(id) ON DELETE CASCADE,
              UNIQUE(fishing_type_id, bait_type_id),
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE TABLE IF NOT EXISTS fishing_methods (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) UNIQUE NOT NULL,
              description TEXT,
              is_active BOOLEAN DEFAULT TRUE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE TABLE IF NOT EXISTS locations (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) UNIQUE NOT NULL,
              latitude DECIMAL(10, 8),
              longitude DECIMAL(11, 8),
              description TEXT,
              is_active BOOLEAN DEFAULT TRUE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE TABLE IF NOT EXISTS fishing_logs (
              id SERIAL PRIMARY KEY,
              user_id INTEGER REFERENCES users(id) ON DELETE CASCADE,
              location_id INTEGER REFERENCES locations(id),
              fishing_type_id INTEGER REFERENCES fishing_types(id),
              fish_species_id INTEGER REFERENCES fish_species(id),
              bait_type_id INTEGER REFERENCES bait_types(id),
              fishing_method_id INTEGER REFERENCES fishing_methods(id),
              quantity_caught INTEGER,
              weight_caught DECIMAL(10, 2),
              weather_condition VARCHAR(50),
              wind_speed DECIMAL(5, 2),
              water_temperature DECIMAL(5, 2),
              moon_phase VARCHAR(20),
              tide_status VARCHAR(20),
              date_caught DATE,
              time_start TIME,
              time_end TIME,
              notes TEXT,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE TABLE IF NOT EXISTS custom_submissions (
              id SERIAL PRIMARY KEY,
              user_id INTEGER REFERENCES users(id) ON DELETE CASCADE,
              submission_type VARCHAR(50),
              value VARCHAR(255),
              status VARCHAR(20) DEFAULT 'pending',
              notes TEXT,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE TABLE IF NOT EXISTS contact_messages (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) NOT NULL,
              email VARCHAR(100) NOT NULL,
              subject VARCHAR(255),
              message TEXT NOT NULL,
              is_read BOOLEAN DEFAULT FALSE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE TABLE IF NOT EXISTS system_logs (
              id SERIAL PRIMARY KEY,
              user_id INTEGER REFERENCES users(id) ON DELETE SET NULL,
              action VARCHAR(255) NOT NULL,
              details TEXT,
              ip_address VARCHAR(45),
              user_agent TEXT,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          EOF
          
          echo "✅ Database schema initialized successfully"
        env:
          PGPASSWORD: testpassword

      - name: Create test users in database
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d fishing_tracker << 'EOF'
          -- Create test user
          INSERT INTO users (username, email, password_hash, is_admin)
          VALUES (
            'E2E Test User',
            'e2etest@fishingtracker.mu',
            '$2a$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi',
            false
          ) ON CONFLICT (email) DO NOTHING;
          
          -- Create admin user
          INSERT INTO users (username, email, password_hash, is_admin)
          VALUES (
            'Admin User',
            'admin@fishingtracker.mu',
            '$2a$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi',
            true
          ) ON CONFLICT (email) DO NOTHING;
          EOF
        env:
          PGPASSWORD: testpassword

      - name: Create backend .env file
        run: |
          cat << EOF > backend/.env
          NODE_ENV=test
          PORT=5000
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=fishing_tracker
          DB_USER=postgres
          DB_PASSWORD=testpassword
          JWT_SECRET=test-jwt-secret-for-e2e-testing
          SESSION_SECRET=test-session-secret
          CORS_ORIGIN=http://localhost:3000,http://localhost:80
          EOF

      - name: Create frontend .env file
        run: |
          cat << EOF > frontend/.env
          REACT_APP_API_URL=http://localhost:5000/api
          EOF

      - name: Start backend server
        run: |
          cd backend
          echo "Starting backend server..."
          nohup npm start > backend.log 2>&1 &
          echo $! > backend.pid
          sleep 10
          if ! ps -p $(cat backend.pid) > /dev/null; then
            echo "❌ Backend failed to start"
            echo "=== BACKEND LOGS ==="
            cat backend.log
            exit 1
          fi
          echo "✅ Backend server started (PID: $(cat backend.pid))"
        env:
          NODE_ENV: test

      - name: Build and start frontend
        run: |
          cd frontend
          echo "Building frontend..."
          npm run build 2>&1 | tee frontend-build.log
          
          if [ ! -d "build" ]; then
            echo "❌ Frontend build failed - no build directory created"
            cat frontend-build.log
            exit 1
          fi
          
          echo "✅ Frontend build successful"
          echo "Installing serve..."
          npm install -g serve
          echo "Starting frontend server on port 3000..."
          nohup serve -s build -l 3000 > frontend.log 2>&1 &
          echo $! > frontend.pid
          sleep 8
          if ! ps -p $(cat frontend.pid) > /dev/null; then
            echo "❌ Frontend process died. Logs:"
            cat frontend.log
            exit 1
          fi
          echo "✅ Frontend server process started (PID: $(cat frontend.pid))"
        env:
          CI: false
          SKIP_PREFLIGHT_CHECK: true

      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend..."
          for i in {1..60}; do
            if curl -s http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Backend is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ Backend failed to respond"
              if [ -f backend.log ]; then cat backend.log; fi
              exit 1
            fi
            sleep 2
          done
          
          echo "Waiting for frontend on port 3000..."
          for i in {1..60}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null)
            if [ "$response" = "200" ] || [ "$response" = "304" ]; then
              echo "✅ Frontend is ready! (HTTP $response)"
              break
            fi
            echo "  Attempt $i/60 - HTTP response: $response"
            if [ $i -eq 60 ]; then
              echo "❌ Frontend failed to respond - last HTTP code: $response"
              echo "Frontend server logs:"
              cat frontend.log 2>/dev/null || echo "No frontend logs available"
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright tests
        run: |
          cd e2e
          npx playwright test --reporter=html,github,json
        env:
          CI: true
          TEST_BASE_URL: http://localhost:3000
          TEST_API_URL: http://localhost:5000/api

      - name: Collect server logs on failure
        if: failure()
        run: |
          echo "=== BACKEND LOGS ===" 
          [ -f backend.log ] && cat backend.log || echo "No backend logs found"
          echo ""
          echo "=== FRONTEND LOGS ===" 
          [ -f frontend.log ] && cat frontend.log || echo "No frontend logs found"
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            e2e/test-results/
          retention-days: 7

      - name: Generate test summary
        if: always()
        run: |
          cd e2e
          if [ -f test-results/results.json ]; then
            echo "## 🧪 E2E Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Parse JSON results
            PASSED=$(jq -r '.stats.expected // 0' test-results/results.json)
            FAILED=$(jq -r '.stats.unexpected // 0' test-results/results.json)
            SKIPPED=$(jq -r '.stats.skipped // 0' test-results/results.json)
            DURATION=$(jq -r '.stats.duration // 0' test-results/results.json)
            
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${DURATION}ms |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📊 Full report available in the artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup test data
        if: always()
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d fishing_tracker << 'EOF'
          -- Clean up test data
          DELETE FROM fishing_logs WHERE notes LIKE 'E2E_TEST_%';
          DELETE FROM custom_submissions WHERE value LIKE 'E2E%' OR value LIKE '%E2E Test%';
          DELETE FROM contact_messages WHERE name LIKE 'E2E_TEST_%';
          EOF
        env:
          PGPASSWORD: testpassword
        continue-on-error: true

  test-report:
    name: Publish Test Report
    needs: e2e-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
        continue-on-error: true

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results
        continue-on-error: true

      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/main' && hashFiles('playwright-report/*') != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: test-reports/${{ github.run_id }}
        continue-on-error: true

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let summary = '## 🧪 E2E Test Results\n\n';
            
            try {
              const resultsPath = 'test-results/results.json';
              if (fs.existsSync(resultsPath)) {
                const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                
                const passed = results.stats?.expected || 0;
                const failed = results.stats?.unexpected || 0;
                const skipped = results.stats?.skipped || 0;
                
                summary += `| Status | Count |\n`;
                summary += `|--------|-------|\n`;
                summary += `| ✅ Passed | ${passed} |\n`;
                summary += `| ❌ Failed | ${failed} |\n`;
                summary += `| ⏭️ Skipped | ${skipped} |\n\n`;
                
                if (failed > 0) {
                  summary += `⚠️ **${failed} test(s) failed.** Check workflow logs for details.\n`;
                } else {
                  summary += `✅ **All tests passed!**\n`;
                }
              } else {
                summary += '⚠️ Test results not found. Workflow may have encountered issues.\n';
              }
            } catch (error) {
              summary += `Error reading test results: ${error.message}\n`;
            }
            
            summary += '\n📊 [View Full Logs](../actions/runs/${{ github.run_id }})\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
        continue-on-error: true
